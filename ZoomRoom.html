<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoom Kelas | Felvan Course</title>
<style>
html,body{margin:0;height:100%;background:#0f172a;color:#fff;font-family:system-ui,sans-serif}
#fvm{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#fvm button{padding:12px 22px;border:0;border-radius:12px;background:#FF8C00;color:#fff;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div id="zmmtg-root" style="display:none"></div>
<div id="fvm"><p id="fvt">Menyiapkan ruang Zoom...</p><button id="fvb" style="display:none">Buka di tab baru</button></div>
<script>
(function () {
  var V = '7.1.9', B = 'https://source.zoom.us/'; // ganti V bila Zoom merilis versi Meeting SDK Web yang lebih baru
  var C = "<?= params.c || '' ?>", E = "<?= params.e || '' ?>", LEFT = "<?= params.left || '' ?>";
  var t = document.getElementById('fvt'), m = document.getElementById('fvm'), z = document.getElementById('zmmtg-root'), b = document.getElementById('fvb');
  function say(s, tab) { m.style.display = 'flex'; z.style.display = 'none'; t.textContent = s; b.style.display = tab ? 'inline-block' : 'none'; }
  b.onclick = function () { window.open(location.href, '_blank'); };
  if (LEFT) {
    say('Kamu sudah keluar dari meeting.');
    try { var w = window; while (w !== w.top) { w = w.parent; w.postMessage({ fvZoomLeft: 1 }, '*'); } } catch (e) {}
    return;
  }
  ['bootstrap', 'react-select'].forEach(function (n) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = B + V + '/css/' + n + '.css'; document.head.appendChild(l); });
  function ld(u) { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = u; s.onload = ok; s.onerror = function () { no(new Error('Gagal memuat ' + u)); }; document.head.appendChild(s); }); }
  function join(r) {
    try { ZoomMtg.setZoomJSLib(B + V + '/lib', '/av'); ZoomMtg.preLoadWasm(); ZoomMtg.prepareWebSDK(); ZoomMtg.i18n.load('en-US'); } catch (e) {}
    m.style.display = 'none'; z.style.display = 'block';
    var bad = function (e) { say('Gagal masuk: ' + ((e && (e.errorMessage || e.message)) || 'coba buka di tab baru'), true); };
    ZoomMtg.init({
      leaveUrl: r.leave, patchJsMedia: true, error: bad,
      success: function () {
        ZoomMtg.join({ signature: r.signature, sdkKey: r.sdkKey, meetingNumber: r.mn, passWord: r.pwd, userName: r.name, userEmail: E, zak: r.zak || undefined, success: function () {}, error: bad });
      }
    });
  }
  ['react', 'react-dom', 'redux', 'redux-thunk', 'lodash'].reduce(function (p, n) { return p.then(function () { return ld(B + V + '/lib/vendor/' + n + '.min.js'); }); }, Promise.resolve())
    .then(function () { return ld(B + 'zoom-meeting-' + V + '.min.js'); })
    .then(function () {
      google.script.run.withSuccessHandler(function (r) { if (!r || r.status !== 'success') return say((r && r.message) || 'Data meeting tidak bisa dimuat.'); join(r); })
        .withFailureHandler(function (e) { say(e.message || String(e)); }).zmRoom(E, C);
    })
    .catch(function (e) { say(e.message, true); });
})();
</script>
</body>
</html>
