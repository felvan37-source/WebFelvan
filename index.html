<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- SEO -->
  <title>Felvan Course - Kursus Bahasa Inggris Online</title>
  <meta name="application-name" content="Felvan Course">
  <meta name="description" content="Belajar Bahasa Inggris online interaktif lewat Zoom meeting bersama Felvan Course. Siap berbicara Bahasa Inggris dengan percaya diri dari mana saja? Yuk gabung!">
  <meta name="robots" content="index, follow">
  <link id="canonicalLink" rel="canonical" href="https://www.felvancourse.online/">

  <!-- Google Site Name -->
  <script type="application/ld+json" id="websiteSchema">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Felvan Course",
    "alternateName": "Felvan",
    "url": "https://www.felvancourse.online/"
  }
  </script>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Felvan Course">
  <meta property="og:title" content="Felvan Course - Kursus Bahasa Inggris Online via Zoom">
  <meta property="og:description" content="Belajar Bahasa Inggris online interaktif lewat Zoom meeting bersama Felvan Course. Gabung dan belajar dari mana saja.">
  <meta property="og:url" content="https://www.felvancourse.online/">
  <meta property="og:image" content="https://iili.io/CYBXpR4.png">

  <!-- Icons & PWA -->
  <link rel="icon" href="https://iili.io/CYBXpR4.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- OneSignal SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    .wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    iframe {
      position: absolute;
      top: -10px;
      left: 0;
      width: 100%;
      height: calc(100% + 10px);
      border: 0;
    }
    @media (max-width: 600px) {
      iframe {
        top: -10px;
        height: calc(100% + 10px);
      }
    }
    /* Teks SEO dan screen reader */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

<body>
  <!-- Konten SEO halaman utama -->
  <div class="sr-only">
    <h1 id="seoTitle">Felvan Course - Kursus Bahasa Inggris Online</h1>
    <p id="seoDesc">
      Belajar Bahasa Inggris online interaktif lewat Zoom meeting.
      Siap berbicara Bahasa Inggris dengan percaya diri dari mana saja?
      Yuk gabung di Felvan Course!
    </p>
  </div>

  <!-- Aplikasi Utama (Iframe) -->
  <div class="wrap">
    <iframe
      id="app"
      title="Felvan Course System"
      allow="autoplay *; encrypted-media *; picture-in-picture *; fullscreen *; clipboard-write; camera; microphone; geolocation"
      allowfullscreen>
    </iframe>
  </div>

  <!-- Tombol instalasi PWA -->
  <div data-nosnippet>
    <button
      id="installBtn"
      style="display:none;position:fixed;bottom:16px;right:16px;z-index:9999;padding:12px 18px;border:0;border-radius:24px;background:#1a73e8;color:#fff;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer">
      Install Aplikasi
    </button>
  </div>

  <script>
    // URL Web App Google Apps Script
    const GAS = "https://script.google.com/macros/s/AKfycbyMH2Tqm_eGNDB-V-EB6x9wMT1L59tOevuOICUpc-l-bu8bSw7BufMT1oJZrDK3hRe3kQ/exec";

    // Helper membuat format URL Slug (contoh: "Tugas Grammar" -> "tugas-grammar")
    function slugify(text) {
      return text.toString().toLowerCase().trim()
        .replace(/\s+/g, '-')       
        .replace(/[^\w\-]+/g, '')   
        .replace(/\-\-+/g, '-');    
    }

    // 1. ROUTING CLIENT-SIDE (Cek URL saat halaman di-refresh/reload)
    let currentPath = window.location.pathname;
    let urlParams = new URLSearchParams(window.location.search);
    let view = urlParams.get("v") || "LandingPage";

    // Peta Path URL ke View Apps Script
    if (currentPath === "/" || currentPath === "/home") view = "LandingPage";
    else if (currentPath.startsWith("/dashboard-soal")) view = "QuizEditor";
    else if (currentPath.startsWith("/hasil-siswa")) view = "Verification";
    else if (currentPath.startsWith("/dashboard-article")) view = "AdminArticle";
    else if (currentPath.startsWith("/article/")) view = "ArticleDetail";
    else if (currentPath.startsWith("/quiz/")) view = "QuizPlayer";

    // Set param 'v' yg benar untuk dikirim ke Iframe GAS
    urlParams.set("v", view);

    const appFrame = document.getElementById("app");
    const seoTitle = document.getElementById("seoTitle");
    const seoDesc = document.getElementById("seoDesc");
    const canonicalLink = document.getElementById("canonicalLink");

    // Terapkan URL ke Iframe GAS
    appFrame.src = GAS + "?" + urlParams.toString();

    // 2. FUNGSI UPDATE URL BROWSER (Merapikan address bar tanpa me-reload)
    function updateBrowserURL(pageView, title) {
      let newPath = "/";
      let newSearch = new URLSearchParams(window.location.search);
      newSearch.delete("v"); // Hilangkan '?v=' agar rapi

      if (pageView === "LandingPage") newPath = "/home";
      else if (pageView === "QuizEditor") newPath = "/dashboard-soal";
      else if (pageView === "Verification") newPath = "/hasil-siswa";
      else if (pageView === "AdminArticle") newPath = "/dashboard-article";
      else if (pageView === "ArticleDetail") {
        let slug = title ? slugify(title) : "detail";
        newPath = "/article/" + slug;
      }
      else if (pageView === "QuizPlayer") {
        let slug = title ? slugify(title) : "play";
        newPath = "/quiz/" + slug;
      } else {
        newPath = currentPath; // Pertahankan path jika tidak terdaftar
        newSearch.set("v", pageView);
      }

      let searchStr = newSearch.toString();
      let finalUrl = newPath + (searchStr ? "?" + searchStr : "");
      window.history.replaceState(null, title || document.title, finalUrl);
      canonicalLink.href = window.location.href; // Update Canonical
    }

    // Eksekusi untuk merapikan URL statis segera saat web pertama dimuat
    if (["LandingPage", "QuizEditor", "Verification", "AdminArticle"].includes(view)) {
       updateBrowserURL(view, document.title);
    }

    // Fungsi memperbarui metadata
    function setTag(selector, attr, value) {
      const el = document.querySelector(selector);
      if (el && value) el.setAttribute(attr, value);
    }

    // Normalisasi teks
    function cleanText(value, maxLength) {
      return String(value || "").replace(/\s+/g, " ").trim().slice(0, maxLength);
    }

    function updateArticleMetadata(data) {
      const title = cleanText(data.title, 120);
      const desc = cleanText(data.description, 160);
      if (!title) return;

      const fullTitle = title + " | Felvan Course";
      
      document.title = fullTitle;
      seoTitle.textContent = title;
      seoDesc.textContent = desc;

      // Ubah URL address bar ke -> /article/judul-artikelnya
      updateBrowserURL("ArticleDetail", title);

      const articleURL = window.location.href;
      setTag('meta[name="description"]', "content", desc);
      setTag('meta[property="og:type"]', "content", "article");
      setTag('meta[property="og:title"]', "content", fullTitle);
      setTag('meta[property="og:description"]', "content", desc);
      setTag('meta[property="og:url"]', "content", articleURL);

      let schemaScript = document.getElementById("articleSchema");
      if (!schemaScript) {
        schemaScript = document.createElement("script");
        schemaScript.type = "application/ld+json";
        schemaScript.id = "articleSchema";
        document.head.appendChild(schemaScript);
      }
      schemaScript.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": title,
        "description": desc,
        "mainEntityOfPage": { "@type": "WebPage", "@id": articleURL },
        "publisher": { "@type": "Organization", "name": "Felvan Course", "url": "https://www.felvancourse.online/" }
      });
    }

    // Pendaftaran Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js"); });
    }

    // Inisialisasi OneSignal
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function (OneSignal) {
      await OneSignal.init({
        appId: "8530aeec-868f-45ef-ba6c-2613f17de0b5",
        serviceWorkerPath: "/sw.js",
        serviceWorkerParam: { scope: "/" }
      });
    });

    // 3. EVENT LISTENER PESAN DARI IFRAME GAS
    window.addEventListener("message", function (ev) {
      let host = "";
      try { host = new URL(ev.origin).hostname; } catch (e) { return; }
      const ok = host === "script.google.com" || host.endsWith(".googleusercontent.com");
      if (!ok || ev.source !== appFrame.contentWindow) return;

      const d = ev.data || {};

      // Fitur Notifikasi Push OneSignal
      if (d.type === "felvan-login" && d.email) {
        OneSignalDeferred.push(async function (OneSignal) {
          await OneSignal.login(d.email);
          const tags = { nama: String(d.name || ""), email: String(d.email), role: String(d.role || ""), kelas: String(d.className || ""), status_akun: String(d.status || "") };
          String(d.classId || "").split(",").map(x => x.trim()).forEach(id => { if (id && id.indexOf("PRG") !== 0) tags["kelas_" + id] = "1"; });
          OneSignal.User.addTags(tags);
          OneSignal.Slidedown.promptPush();
        });
      }
      else if (d.type === "felvan-logout") {
        OneSignalDeferred.push(async function (OneSignal) { await OneSignal.logout(); });
      }
      // Membuka Artikel Ter-intercept URLnya
      else if (d.type === "felvan-article" && d.title) {
        updateArticleMetadata(d);
      }
      // Membuka Quiz Ter-intercept URLnya (contoh: jika iframe men-trigger felvan-quiz)
      else if (d.type === "felvan-quiz" && d.title) {
        const fullTitle = cleanText(d.title, 120) + " | Felvan Course";
        document.title = fullTitle;
        updateBrowserURL("QuizPlayer", d.title);
      }
      // Route Navigator dinamis dari GAS
      else if (d.type === "felvan-navigate" && d.view) {
        if(d.title) document.title = cleanText(d.title, 120) + " | Felvan Course";
        updateBrowserURL(d.view, d.title);
      }
    });

    // PWA Install Prompt
    let deferredPrompt;
    const installBtn = document.getElementById("installBtn");
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault(); deferredPrompt = e; installBtn.style.display = "block";
    });
    installBtn.addEventListener("click", async function () {
      installBtn.style.display = "none";
      if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
    });
    window.addEventListener("appinstalled", function () { installBtn.style.display = "none"; });
  </script>
</body>
</html>
