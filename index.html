<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Felvan Course System</title>
  <link rel="icon" href="https://iili.io/CYBXpR4.png">

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    .wrap { position: fixed; inset: 0; overflow: hidden; }
    iframe {
  position: absolute;
  top: -10px;                    /* tadinya -50px */
  left: 0;
  width: 100%;
  height: calc(100% + 10px);     /* samakan dengan nilai top */
  border: 0;
}
@media (max-width: 600px) {
  iframe { top: -10px; height: calc(100% + 10px); }  /* tadinya 60px */
}
  </style>
</head>
<body>
  <div class="wrap">
    <iframe id="app"
      allow="clipboard-write; camera; microphone; geolocation; fullscreen"
      allowfullscreen></iframe>
  </div>

  <button id="installBtn" style="display:none;position:fixed;bottom:16px;right:16px;z-index:9999;padding:12px 18px;border:0;border-radius:24px;background:#1a73e8;color:#fff;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer">
    Install Aplikasi
  </button>

  <script>
    const GAS = "https://script.google.com/macros/s/AKfycbyMH2Tqm_eGNDB-V-EB6x9wMT1L59tOevuOICUpc-l-bu8bSw7BufMT1oJZrDK3hRe3kQ/exec";
    document.getElementById("app").src = GAS + window.location.search;

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js");
      });
    }

    // OneSignal
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function (OneSignal) {
      await OneSignal.init({
        appId: "8530aeec-868f-45ef-ba6c-2613f17de0b5",
        serviceWorkerPath: "sw.js",
        serviceWorkerParam: { scope: "/" }
      });
    });

    // Terima data akun dari aplikasi GAS (login/logout)
    window.addEventListener("message", function (ev) {
      let host = "";
      try { host = new URL(ev.origin).hostname; } catch (e) { return; }
      const ok = host === "script.google.com" || host.endsWith(".googleusercontent.com");
      if (!ok) return;

      const d = ev.data || {};
      if (d.type === "felvan-login" && d.email) {
        OneSignalDeferred.push(async function (OneSignal) {
          await OneSignal.login(d.email);

          const tags = {
            nama: String(d.name || ""),
            email: String(d.email),
            role: String(d.role || ""),
            kelas: String(d.className || ""),
            status_akun: String(d.status || "")
          };
          String(d.classId || "").split(",").map(function (x) { return x.trim(); }).forEach(function (id) {
            if (id && id.indexOf("PRG") !== 0) tags["kelas_" + id] = "1";
          });
          OneSignal.User.addTags(tags);

          OneSignal.Slidedown.promptPush();
        });
      } else if (d.type === "felvan-logout") {
        OneSignalDeferred.push(async function (OneSignal) {
          await OneSignal.logout();
        });
      }
    });

    // Tombol install
    let deferredPrompt;
    const installBtn = document.getElementById("installBtn");
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = "block";
    });
    installBtn.addEventListener("click", async function () {
      installBtn.style.display = "none";
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      }
    });
    window.addEventListener("appinstalled", function () {
      installBtn.style.display = "none";
    });
  </script>
</body>
</html>
