<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- SEO -->
  <title>Felvan Course - Kursus Bahasa Inggris Online</title>
  <meta name="application-name" content="Felvan Course">
  <meta name="description" content="Belajar Bahasa Inggris online interaktif lewat Zoom meeting bersama Felvan Course. Siap berbicara Bahasa Inggris dengan percaya diri dari mana saja? Yuk gabung!">
  <link rel="canonical" href="https://felvancourse.online/">
  <meta name="robots" content="index, follow">

  <!-- Google Site Name -->
  <script type="application/ld+json" id="websiteSchema">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Felvan Course",
    "alternateName": "Felvan",
    "url": "https://felvancourse.online/"
  }
  </script>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Felvan Course">
  <meta property="og:title" content="Felvan Course - Kursus Bahasa Inggris Online via Zoom">
  <meta property="og:description" content="Belajar Bahasa Inggris online interaktif lewat Zoom meeting bersama Felvan Course. Gabung dan belajar dari mana saja.">
  <meta property="og:url" content="https://felvancourse.online/">
  <meta property="og:image" content="https://iili.io/CYBXpR4.png">

  <link rel="icon" href="https://iili.io/CYBXpR4.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- OneSignal SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    .wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    iframe {
      position: absolute;
      top: -10px;
      left: 0;
      width: 100%;
      height: calc(100% + 10px);
      border: 0;
    }

    @media (max-width: 600px) {
      iframe {
        top: -10px;
        height: calc(100% + 10px);
      }
    }

    /* Teks SEO dan screen reader */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

<body>
  <!-- Konten SEO halaman utama -->
  <div class="sr-only">
    <h1 id="seoTitle">Felvan Course - Kursus Bahasa Inggris Online</h1>
    <p id="seoDesc">
      Belajar Bahasa Inggris online interaktif lewat Zoom meeting.
      Siap berbicara Bahasa Inggris dengan percaya diri dari mana saja?
      Yuk gabung di Felvan Course!
    </p>
  </div>

  <div class="wrap">
    <iframe
      id="app"
      title="Felvan Course System"
      allow="autoplay *; encrypted-media *; picture-in-picture *; fullscreen *; clipboard-write; camera; microphone; geolocation"
      allowfullscreen>
    </iframe>
  </div>

  <!-- Tombol instalasi PWA -->
  <div data-nosnippet>
    <button
      id="installBtn"
      style="display:none;position:fixed;bottom:16px;right:16px;z-index:9999;padding:12px 18px;border:0;border-radius:24px;background:#1a73e8;color:#fff;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer">
    </button>
  </div>

  <script>
    // URL Web App Google Apps Script
    const GAS = "https://script.google.com/macros/s/AKfycbyMH2Tqm_eGNDB-V-EB6x9wMT1L59tOevuOICUpc-l-bu8bSw7BufMT1oJZrDK3hRe3kQ/exec";

    // Alamat cantik (tetap) -> halaman Apps Script (parameter v)
    const ROUTES = {
      "/home": "LandingPage",
      "/classroom": "Index",
      "/dashboard": "Index",
      "/admin": "Admin",
      "/dashboard-soal": "QuizEditor",
      "/hasil-siswa": "Verification",
      "/dashboard-article": "AdminArticles"
    };

    // Alamat cantik dengan judul di belakangnya: /article/judul-artikel dan /quiz/judul-kuis
    const PREFIX_ROUTES = {
      "/article": "ArticleDetail",
      "/quiz": "QuizPlayer"
    };

    // Kebalikannya: halaman Apps Script -> alamat cantik yang tampil di browser
    const PRETTY = {
      "LandingPage": "/home",
      "Index": "/classroom",
      "Admin": "/admin",
      "QuizEditor": "/dashboard-soal",
      "Verification": "/hasil-siswa",
      "AdminArticles": "/dashboard-article",
      "ArticleDetail": "/article",
      "QuizPlayer": "/quiz"
    };

    // Halaman Apps Script yang sedang dibuka di iframe (diisi oleh blok pemuat di bawah)
    let PAGE = "LandingPage";

    // Query string tanpa parameter v (apa adanya, tanpa di-encode ulang)
    function queryWithoutV() {
      const rest = window.location.search.replace(/^\?/, "").split("&").filter(function (s) {
        return s && s.split("=")[0] !== "v";
      });
      return rest.length ? "?" + rest.join("&") : "";
    }

    // Ubah judul jadi slug alamat: "Tips Belajar Grammar!" -> "tips-belajar-grammar"
    function slugify(text) {
      return String(text || "")
        .replace(/<[^>]*>/g, " ")
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/&/g, " dan ")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 80)
        .replace(/-+$/g, "");
    }

    // Ganti alamat di address bar tanpa reload
    function setAddress(path) {
      try { history.replaceState(null, "", path); } catch (e) {}
    }

    // Muat aplikasi beserta parameter URL
    (function () {
      const path = window.location.pathname.replace(/\/+$/, "").toLowerCase() || "/";
      const v = new URLSearchParams(window.location.search).get("v");
      let page = v;
      let src = GAS + window.location.search;

      // Alamat cantik (mis. /classroom) -> tambahkan ?v=... otomatis untuk iframe
      if (!page) {
        page = ROUTES[path] || null;

        if (!page) {
          for (const prefix in PREFIX_ROUTES) {
            if (path === prefix || path.indexOf(prefix + "/") === 0) page = PREFIX_ROUTES[prefix];
          }
        }

        if (page) {
          const rest = queryWithoutV();
          src = GAS + "?v=" + page + (rest ? "&" + rest.slice(1) : "");
        }
      }

      document.getElementById("app").src = src;
      PAGE = page || "LandingPage";

      // Link lama /?v=... dirapikan jadi alamat cantik (parameter lain tetap dibawa)
      if (path === "/" && v && PRETTY[v]) {
        setAddress(PRETTY[v] + queryWithoutV() + window.location.hash);
      }
    })();

    // Fungsi untuk memperbarui metadata
    function setTag(selector, attr, value) {
      var el = document.querySelector(selector);

      if (el && value !== undefined && value !== null) {
        el.setAttribute(attr, value);
      }
    }

    // Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js");
      });
    }

    // Inisialisasi OneSignal
    window.OneSignalDeferred = window.OneSignalDeferred || [];

    OneSignalDeferred.push(async function (OneSignal) {
      await OneSignal.init({
        appId: "8530aeec-868f-45ef-ba6c-2613f17de0b5",
        serviceWorkerPath: "/sw.js",
        serviceWorkerParam: {
          scope: "/"
        }
      });
    });

    // Menerima pesan dari iframe GAS
    window.addEventListener("message", function (ev) {
      let host = "";

      try {
        host = new URL(ev.origin).hostname;
      } catch (e) {
        return;
      }

      const ok =
        host === "script.google.com" ||
        host.endsWith(".googleusercontent.com");

      if (!ok) return;

      const d = ev.data || {};

      // LOGIN
      if (d.type === "felvan-login" && d.email) {
        OneSignalDeferred.push(async function (OneSignal) {
          await OneSignal.login(d.email);

          const tags = {
            nama: String(d.name || ""),
            email: String(d.email),
            role: String(d.role || ""),
            kelas: String(d.className || ""),
            status_akun: String(d.status || "")
          };

          String(d.classId || "")
            .split(",")
            .map(function (x) {
              return x.trim();
            })
            .forEach(function (id) {
              if (id && id.indexOf("PRG") !== 0) {
                tags["kelas_" + id] = "1";
              }
            });

          OneSignal.User.addTags(tags);
          OneSignal.Slidedown.promptPush();
        });
      }

      // LOGOUT
      else if (d.type === "felvan-logout") {
        OneSignalDeferred.push(async function (OneSignal) {
          await OneSignal.logout();
        });
      }

      // ARTIKEL
      else if (d.type === "felvan-article" && d.title) {
        var title = String(d.title).slice(0, 120);
        var desc = String(d.description || "").slice(0, 160);

        var fullTitle = title + " - Felvan Course";

        var url = d.id
          ? location.origin + "/?v=ArticleDetail&id=" +
            encodeURIComponent(String(d.id))
          : location.origin + "/" + location.search;

        // Rapikan alamat browser jadi /article/judul-artikel?id=...
        // Hanya jika halaman ini memang halaman artikel (bukan artikel yang dibuka sebagai pop-up di dashboard)
        if (d.id && PAGE === "ArticleDetail") {
          var artSlug = slugify(title);
          var artPath = "/article" + (artSlug ? "/" + artSlug : "") +
            "?id=" + encodeURIComponent(String(d.id));
          setAddress(artPath);
          url = location.origin + artPath;
        }

        // Perbarui judul halaman
        document.title = fullTitle;

        // Perbarui konten SEO
        document.getElementById("seoTitle").textContent = title;
        document.getElementById("seoDesc").textContent = desc;

        // Perbarui meta description, canonical, dan Open Graph
        setTag('meta[name="description"]', "content", desc);
        setTag('link[rel="canonical"]', "href", url);
        setTag('meta[property="og:title"]', "content", fullTitle);
        setTag('meta[property="og:description"]', "content", desc);
        setTag('meta[property="og:url"]', "content", url);

        // Perbarui schema artikel secara dinamis
        var articleSchema = {
          "@context": "https://schema.org",
          "@type": "Article",
          "headline": title,
          "description": desc,
          "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": url
          },
          "publisher": {
            "@type": "Organization",
            "name": "Felvan Course",
            "url": "https://felvancourse.online/"
          }
        };

        var schemaScript = document.getElementById("articleSchema");

        if (!schemaScript) {
          schemaScript = document.createElement("script");
          schemaScript.type = "application/ld+json";
          schemaScript.id = "articleSchema";
          document.head.appendChild(schemaScript);
        }

        schemaScript.textContent = JSON.stringify(articleSchema);
      }

      // KUIS / TUGAS (judul dikirim dari QuizPlayer.html)
      else if (d.type === "felvan-quiz" && d.title) {
        if (PAGE === "QuizPlayer") {
          var quizTitle = String(d.title).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim().slice(0, 120);
          var quizSlug = slugify(quizTitle);

          setAddress("/quiz" + (quizSlug ? "/" + quizSlug : "") + queryWithoutV() + window.location.hash);

          if (quizTitle) document.title = quizTitle + " - Felvan Course";
        }
      }
    });

    // PWA INSTALL PROMPT
    let deferredPrompt;
    const installBtn = document.getElementById("installBtn");

    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;

      installBtn.textContent = "Install Aplikasi";
      installBtn.style.display = "block";
    });

    installBtn.addEventListener("click", async function () {
      installBtn.style.display = "none";

      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      }
    });

    window.addEventListener("appinstalled", function () {
      installBtn.style.display = "none";
    });
  </script>
</body>
</html>
