<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- SEO -->
  <title>Felvan Course - Kursus Bahasa Inggris Online via Zoom</title>
  <meta name="description" content="Belajar Bahasa Inggris online interaktif lewat Zoom meeting bersama Felvan Course. Siap berbicara Bahasa Inggris dengan percaya diri dari mana saja? Yuk gabung!">
  <link rel="canonical" href="https://felvancourse.online/">
  <meta name="robots" content="index, follow">

  <!-- Open Graph (tampilan saat link dibagikan) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Felvan Course">
  <meta property="og:title" content="Felvan Course - Kursus Bahasa Inggris Online via Zoom">
  <meta property="og:description" content="Belajar Bahasa Inggris online interaktif lewat Zoom meeting bersama Felvan Course. Gabung dan belajar dari mana saja.">
  <meta property="og:url" content="https://felvancourse.online/">
  <meta property="og:image" content="https://iili.io/CYBXpR4.png">

  <link rel="icon" href="https://iili.io/CYBXpR4.png">

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- Load OneSignal SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    .wrap { position: fixed; inset: 0; overflow: hidden; }
    iframe {
      position: absolute;
      top: -10px;
      left: 0;
      width: 100%;
      height: calc(100% + 10px);
      border: 0;
    }
    @media (max-width: 600px) {
      iframe { top: -10px; height: calc(100% + 10px); }
    }

    /* Teks untuk mesin pencari & screen reader, tidak tampil di layar */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <!-- Konten yang bisa dibaca Google (iframe GAS tidak terbaca sebagai konten halaman ini) -->
  <div class="sr-only">
    <h1 id="seoTitle">Felvan Course - Kursus Bahasa Inggris Online</h1>
    <p id="seoDesc">Belajar Bahasa Inggris online interaktif lewat Zoom meeting. Siap berbicara Bahasa Inggris dengan percaya diri dari mana saja? Yuk gabung di Felvan Course!</p>
  </div>

  <div class="wrap">
    <iframe id="app" title="Felvan Course System" allow="clipboard-write; camera; microphone; geolocation; fullscreen" allowfullscreen></iframe>
  </div>

  <!-- data-nosnippet harus di div/span/section (tidak berlaku di button). Teks tombol diisi lewat JS. -->
  <div data-nosnippet>
    <button id="installBtn" style="display:none;position:fixed;bottom:16px;right:16px;z-index:9999;padding:12px 18px;border:0;border-radius:24px;background:#1a73e8;color:#fff;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer"></button>
  </div>

  <script>
    // URL Web App Google Apps Script milikmu
    const GAS = "https://script.google.com/macros/s/AKfycbyMH2Tqm_eGNDB-V-EB6x9wMT1L59tOevuOICUpc-l-bu8bSw7BufMT1oJZrDK3hRe3kQ/exec";
    document.getElementById("app").src = GAS + window.location.search;

    // Fungsi bantu: ubah isi sebuah tag di <head>
    function setTag(selector, attr, value) {
      var el = document.querySelector(selector);
      if (el && value) el.setAttribute(attr, value);
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js");
      });
    }

    // Inisialisasi OneSignal
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function (OneSignal) {
      await OneSignal.init({
        appId: "8530aeec-868f-45ef-ba6c-2613f17de0b5",
        serviceWorkerPath: "/sw.js",
        serviceWorkerParam: { scope: "/" }
      });
    });

    // LISTENER: Menangkap pesan dari iframe (GAS) saat user Login / Logout
    window.addEventListener("message", function (ev) {
      let host = "";
      try { host = new URL(ev.origin).hostname; } catch (e) { return; }
      const ok = host === "script.google.com" || host.endsWith(".googleusercontent.com");
      if (!ok) return;

      const d = ev.data || {};

      // Jika murid berhasil login
      if (d.type === "felvan-login" && d.email) {
        OneSignalDeferred.push(async function (OneSignal) {
          await OneSignal.login(d.email); // Menghubungkan email dengan device

          const tags = {
            nama: String(d.name || ""),
            email: String(d.email),
            role: String(d.role || ""),
            kelas: String(d.className || ""),
            status_akun: String(d.status || "")
          };

          String(d.classId || "").split(",").map(function (x) { return x.trim(); }).forEach(function (id) {
            if (id && id.indexOf("PRG") !== 0) tags["kelas_" + id] = "1";
          });
          OneSignal.User.addTags(tags);
          OneSignal.Slidedown.promptPush(); // Minta izin notifikasi
        });
      }
      // Jika murid logout
      else if (d.type === "felvan-logout") {
        OneSignalDeferred.push(async function (OneSignal) {
          await OneSignal.logout();
        });
      }
      // Jika halaman detail artikel selesai dimuat di dalam iframe
      else if (d.type === "felvan-article" && d.title) {
        var title = String(d.title).slice(0, 120);
        var desc = String(d.description || "").slice(0, 160);
        var fullTitle = title + " - Felvan Course";
        var url = d.id
          ? location.origin + "/?v=ArticleDetail&id=" + encodeURIComponent(String(d.id))
          : location.origin + "/" + location.search;

        document.title = fullTitle;
        document.getElementById("seoTitle").textContent = title;
        if (desc) document.getElementById("seoDesc").textContent = desc;

        setTag('meta[name="description"]', "content", desc);
        setTag('link[rel="canonical"]', "href", url);
        setTag('meta[property="og:title"]', "content", fullTitle);
        setTag('meta[property="og:description"]', "content", desc);
        setTag('meta[property="og:url"]', "content", url);
      }
    });

    // PWA Install Prompt
    let deferredPrompt;
    const installBtn = document.getElementById("installBtn");
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.textContent = "Install Aplikasi";
      installBtn.style.display = "block";
    });
    installBtn.addEventListener("click", async function () {
      installBtn.style.display = "none";
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      }
    });
    window.addEventListener("appinstalled", function () {
      installBtn.style.display = "none";
    });
  </script>
</body>
</html>
